<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff8ff">
  <title>Clima interior | Smart Home UDEM</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="toastify-theme.css">
  <style>
    .cl-page { --cl-navy:#183a5e; --cl-soft:#6f8ba5; width:100%; }
    .cl-page *, .cl-page *::before, .cl-page *::after { box-sizing:border-box; }
    .cl-intro { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin:0 0 25px; }
    .cl-intro .eyebrow{letter-spacing:2.5px;margin-bottom:12px;color:#477eac;}
    .cl-intro h1 { font-size:clamp(38px,4.3vw,61px);line-height:1.06;letter-spacing:-2.6px;margin:0 0 9px;color:var(--cl-navy);font-weight:800; }
    .cl-intro h1 span{color:#398cdf;}
    .cl-intro p:last-child{font-size:14px;color:var(--cl-soft);margin:0;max-width:550px;}
    .cl-live{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;color:#3678ab;white-space:nowrap;background:#fff;border:1px solid #dfedf6;border-radius:100px;padding:12px 17px;box-shadow:0 5px 16px #5d9abe10;margin-bottom:5px;}
    .cl-live-dot{height:9px;width:9px;background:#bdcbd9;border-radius:50%;flex-shrink:0;}
    .cl-live.live .cl-live-dot{background:#1fc5a0;box-shadow:0 0 0 5px #1fc5a023;animation:cl-pulse 2.4s infinite;}
    .cl-live.warn{color:#ab7040;}
    .cl-live.warn .cl-live-dot{background:#efa052;}
    .cl-hero{min-height:240px;border-radius:29px;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(113deg,#2169ac 0%,#398dd8 48%,#67c9d8 100%);box-shadow:0 19px 40px #2b80c836;margin-bottom:21px;display:flex;justify-content:space-between;align-items:center;padding:clamp(22px,3.1vw,43px);color:#fff;}
    .cl-hero::before{content:'';position:absolute;z-index:-1;inset:-90px -180px -50px 34%;background:radial-gradient(circle at 68% 30%,#b6f2f078 0%,transparent 41%),radial-gradient(circle at 20% 80%,#ffffff38 0%,transparent 43%);animation:cl-shift 12s ease-in-out infinite alternate;}
    .cl-hero::after{content:'';position:absolute;z-index:-1;width:400px;height:400px;border-radius:50%;border:1px solid #ffffff2c;right:-50px;top:-177px;box-shadow:0 0 0 51px #ffffff09,0 0 0 102px #ffffff06;}
    .cl-hero-copy{z-index:1;max-width:560px;}
    .cl-hero-kicker{display:inline-flex;align-items:center;gap:9px;letter-spacing:2px;font-weight:800;font-size:11px;margin-bottom:17px;color:#daedff;}
    .cl-hero h2{font-size:clamp(29px,3.3vw,44px);line-height:1.12;letter-spacing:-1.3px;margin:0 0 12px;color:#fff;}
    .cl-hero p{font-size:14px;line-height:1.7;color:#e4f3ff;max-width:470px;margin:0;}
    .cl-orbit{position:relative;flex-shrink:0;width:230px;height:180px;display:grid;place-items:center;margin:0 6px;}
    .cl-orb-glow{position:absolute;width:174px;height:174px;border-radius:50%;background:#ffffff1c;filter:blur(1px);box-shadow:0 0 0 30px #ffffff0d,0 0 0 61px #ffffff09;animation:cl-breathe 5s ease-in-out infinite;}
    .cl-orb-sun{position:absolute;width:126px;height:126px;border-radius:50%;top:1px;right:20px;background:radial-gradient(circle at 34% 27%,#fff9d4,#ffde88 57%,#fbbf6b 92%);box-shadow:0 0 62px #fff3bc70;animation:cl-bob 5s ease-in-out infinite;}
    .cl-orb-cloud{position:absolute;bottom:16px;left:4px;width:148px;height:65px;border-radius:90px;background:linear-gradient(165deg,#fff,#d4f3ff);box-shadow:20px 13px 33px #174a854b;animation:cl-bob 5s ease-in-out infinite reverse;}
    .cl-orb-cloud:before,.cl-orb-cloud:after{content:'';position:absolute;background:inherit;border-radius:50%;}
    .cl-orb-cloud:before{width:91px;height:88px;left:22px;bottom:14px;}
    .cl-orb-cloud:after{width:70px;height:66px;right:3px;bottom:9px;}
    .cl-orb-star{position:absolute;right:2px;bottom:18px;color:#ffffffbb;font-size:27px;animation:cl-twinkle 3s infinite;}
    .cl-hero-controls{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:25px;}
    .cl-toggle{min-width:132px;border:1px solid #ffffff35;background:#ffffff26;color:#fff;font-size:12px;font-weight:800;border-radius:13px;padding:12px 18px;display:inline-flex;justify-content:center;align-items:center;gap:9px;transition:background .2s,transform .2s;}
    .cl-toggle:hover{background:#ffffff3a;transform:translateY(-1px)}
    .cl-toggle.on{color:#125782;background:#fff;}
    .cl-toggle:disabled{opacity:.6;cursor:wait;}
    .cl-hero-hint{font-size:12px;color:#e3f7ff;}
    .cl-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:21px;}
    .cl-panel{border-radius:30px;min-height:390px;padding:clamp(23px,2.7vw,36px);position:relative;overflow:hidden;isolation:isolate;border:1px solid #ffffffcc;box-shadow:0 14px 37px #2c75aa13;}
    .cl-temp{background:linear-gradient(137deg,#fff 0%,#fff6ed 63%,#ffecd9 100%);}
    .cl-hum{background:linear-gradient(137deg,#fff 0%,#eef9ff 64%,#dff3ff 100%);}
    .cl-panel::after{content:'';position:absolute;z-index:-1;width:260px;height:260px;border-radius:50%;right:-125px;top:-100px;filter:blur(2px);}
    .cl-temp::after{background:#ffcc994a;}
    .cl-hum::after{background:#a9defd64;}
    .cl-panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px;}
    .cl-panel-label{display:flex;align-items:center;gap:13px;font-size:15px;font-weight:800;color:#325271;}
    .cl-panel-icon{height:50px;width:50px;border-radius:17px;display:grid;place-items:center;font-size:25px;box-shadow:0 7px 18px #7998a721;}
    .cl-temp .cl-panel-icon{background:#fff0e0;}
    .cl-hum .cl-panel-icon{background:#e0f4ff;}
    .cl-panel-tag{font-size:10px;letter-spacing:1.3px;font-weight:900;padding:8px 11px;border:1px solid #e7e9e8;border-radius:99px;background:#ffffffa3;color:#75899d;}
    .cl-metric-layout{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:160px;}
    .cl-number{font-family:'Outfit','DM Sans',sans-serif;font-weight:800;font-size:clamp(82px,8vw,139px);line-height:.93;letter-spacing:-7px;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-block;}
    .cl-number .cl-unit{font-size:.35em;letter-spacing:-2px;vertical-align:top;position:relative;top:12px;margin-left:5px;}
    .cl-temp .cl-number{color:#ed8745;}
    .cl-hum .cl-number{color:#2089ce;}
    .cl-number-empty{font-size:clamp(78px,8vw,126px);color:#a5b8c4!important;}
    .cl-panel-caption{font-size:13px;color:#7f93a5;margin:10px 0 0;}
    .cl-temp-illustration{display:flex;align-items:center;justify-content:center;height:162px;width:86px;flex-shrink:0;opacity:.95;}
    .cl-tube{position:relative;height:135px;width:36px;background:#ffe5d0;border:5px solid #ffccac;border-radius:50px;box-shadow:inset 0 5px 6px #fff9;}
    .cl-tube-fill{position:absolute;bottom:0;left:5px;right:5px;height:var(--fill,35%);background:linear-gradient(#ffa361,#f67849);border-radius:20px;transition:height 1s cubic-bezier(.2,.7,.1,1);}
    .cl-tube:after{content:'';position:absolute;bottom:-20px;left:-16px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#ffc69b,#f88b4d 61%,#ed7243);border:6px solid #ffd7b6;box-shadow:0 8px 17px #f6a66b2f;}
    .cl-ring{width:154px;height:154px;position:relative;flex-shrink:0;display:grid;place-items:center;}
    .cl-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg);}
    .cl-ring-bg{fill:none;stroke:#d9edf9;stroke-width:9;}
    .cl-ring-progress{fill:none;stroke:#48a9e8;stroke-width:9;stroke-linecap:round;stroke-dasharray:352;stroke-dashoffset:352;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
    .cl-ring-core{position:absolute;font-size:43px;animation:cl-bob 4s ease-in-out infinite;filter:drop-shadow(0 7px 7px #7abce356);}
    .cl-panel-footer{margin-top:20px;padding-top:19px;border-top:1px solid #6b9bb11c;}
    .cl-interval{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;margin-bottom:14px;}
    .cl-temp .cl-interval{color:#bc7447;}
    .cl-hum .cl-interval{color:#2984b7;}
    .cl-segmented{height:13px;display:flex;gap:5px;align-items:stretch;position:relative;}
    .cl-segmented span{flex:1;border-radius:99px;opacity:.86;}
    .cl-temp .cl-segmented span:nth-child(1){background:#93c8f3;}
    .cl-temp .cl-segmented span:nth-child(2){background:#72c7b8;}
    .cl-temp .cl-segmented span:nth-child(3){background:#f7b46d;}
    .cl-temp .cl-segmented span:nth-child(4){background:#f38e64;}
    .cl-segment-marker{position:absolute;top:-6px;left:var(--marker,0%);width:24px;height:24px;transform:translateX(-50%);border:4px solid white;border-radius:50%;background:#2d648b;box-shadow:0 2px 12px #174c6540;transition:left 1s ease;}
    .cl-scale{display:flex;justify-content:space-between;font-size:11px;color:#96a8b5;margin-top:10px;}
    .cl-humidity-bar{width:100%;height:13px;background:#d8eaf8;border-radius:100px;overflow:hidden;}
    .cl-humidity-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad4ef,#42a0ed);border-radius:100px;transition:width 1s ease;}
    .cl-information{display:grid;grid-template-columns:1.15fr .9fr .95fr;gap:16px;margin-bottom:8px;}
    .cl-info{background:#fff;border:1px solid #e2edf5;box-shadow:0 8px 23px #5d8bab0b;border-radius:22px;padding:22px;min-width:0;display:flex;align-items:center;gap:14px;}
    .cl-info-icon{flex-shrink:0;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:#eef7ff;font-size:24px;}
    .cl-info-title{font-size:11px;color:#8499ae;font-weight:800;margin-bottom:6px;}
    .cl-info-value{font-size:clamp(14px,1.4vw,19px);line-height:1.25;font-weight:800;color:#275372;}
    .cl-info-sub{font-size:11px;color:#92a4b3;margin-top:5px;line-height:1.4;}
    .cl-footer-note{font-size:11px;color:#8ba1b4;margin-top:13px;}
    @keyframes cl-pulse{0%,100%{box-shadow:0 0 0 5px #1fc5a023}50%{box-shadow:0 0 0 10px #1fc5a007}}
    @keyframes cl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes cl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    @keyframes cl-twinkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes cl-shift{0%{transform:translateX(-14px)}100%{transform:translateX(18px)}}
    @media(max-width:1310px){.cl-metric-layout{min-height:140px}.cl-number{font-size:clamp(70px,8vw,124px)}.cl-number .cl-unit{top:9px}.cl-ring{height:122px;width:122px}.cl-temp-illustration{height:125px;width:66px}.cl-tube{transform:scale(.78)}.cl-information{grid-template-columns:repeat(3,minmax(0,1fr))}.cl-info{padding:17px;gap:10px}.cl-info-icon{width:43px;height:43px}}
    @media(max-width:1120px){.cl-metrics{grid-template-columns:1fr}.cl-panel{min-height:325px}.cl-number{font-size:clamp(94px,14vw,138px)}.cl-ring{height:155px;width:155px}.cl-information{grid-template-columns:repeat(2,minmax(0,1fr))}.cl-information .cl-info:first-child{grid-column:span 2;}}
    @media(max-width:820px){.cl-hero{min-height:225px}.cl-intro h1{font-size:clamp(36px,6vw,49px)}.cl-information{grid-template-columns:repeat(3,minmax(0,1fr))}.cl-information .cl-info:first-child{grid-column:auto}.cl-info{padding:14px}.cl-info-icon{display:none}.cl-info-value{font-size:14px}}
    @media(max-width:640px){.cl-intro{align-items:flex-start;flex-direction:column;gap:12px}.cl-intro h1{letter-spacing:-1.5px}.cl-live{margin:0}.cl-hero{min-height:260px;padding:25px}.cl-hero h2{font-size:30px}.cl-hero-copy{max-width:100%}.cl-orbit{position:absolute;right:-48px;top:0;opacity:.24;transform:scale(.9)}.cl-hero-copy{z-index:2}.cl-hero p{max-width:90%}.cl-metrics{gap:14px}.cl-panel{border-radius:24px;min-height:345px;padding:22px}.cl-panel-top{margin-bottom:13px}.cl-number{font-size:clamp(83px,16vw,122px);letter-spacing:-5px}.cl-number .cl-unit{font-size:.35em}.cl-ring{height:123px;width:123px}.cl-temp-illustration{height:115px;width:57px}.cl-panel-footer{margin-top:18px}.cl-information{grid-template-columns:1fr}.cl-information .cl-info:first-child{grid-column:auto}.cl-info{padding:17px}.cl-info-icon{display:grid}.cl-info-value{font-size:17px}}
    @media(max-width:380px){.cl-panel-label{font-size:13px}.cl-panel-icon{height:42px;width:42px}.cl-ring{height:96px;width:96px}.cl-number{font-size:72px}.cl-panel{min-height:305px}.cl-panel-tag{font-size:9px;padding:6px 8px}.cl-orbit{display:none}}
    @media(prefers-reduced-motion:reduce){.cl-page *, .cl-page *:before,.cl-page *:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app-shell" id="site-shell"></div>
  <template id="page-template">
    <main class="cl-page" id="cl-page">
      <header class="cl-intro">
        <div>
          <p class="eyebrow">AMBIENTE INTERIOR / DHT11</p>
          <h1>Tu espacio, <span>en equilibrio.</span></h1>
          <p>Conoce la temperatura y la humedad de tu entorno con mediciones de tu estación Smart Home.</p>
        </div>
        <div class="cl-live" id="cl-live" aria-live="polite"><span class="cl-live-dot"></span><span id="cl-live-text">Esperando datos</span></div>
      </header>

      <section class="cl-hero" aria-label="Resumen de clima interior">
        <div class="cl-hero-copy">
          <div class="cl-hero-kicker"><span>✦</span> SMART HOME <span>·</span> CLIMA INTERIOR</div>
          <h2 id="cl-headline">Tu ambiente, en tiempo real.</h2>
          <p id="cl-description">Conecta tu estación para visualizar las condiciones actuales de tu espacio.</p>
          <div class="cl-hero-controls">
            <button type="button" class="cl-toggle" id="btn-temp" data-cmd="toggle_temp">◯ &nbsp; INACTIVO</button>
            <span class="cl-hero-hint" id="cl-control-hint">Control del sensor DHT11</span>
          </div>
        </div>
        <div class="cl-orbit" aria-hidden="true">
          <span class="cl-orb-glow"></span>
          <span class="cl-orb-sun"></span>
          <span class="cl-orb-cloud"></span>
          <span class="cl-orb-star">✦</span>
        </div>
      </section>

      <section class="cl-metrics" aria-label="Mediciones ambientales">
        <article class="cl-panel cl-temp">
          <div class="cl-panel-top">
            <div class="cl-panel-label"><span class="cl-panel-icon" aria-hidden="true">🌡️</span><span>Temperatura</span></div>
            <span class="cl-panel-tag">AMBIENTE</span>
          </div>
          <div class="cl-metric-layout">
            <div>
              <div class="cl-number" id="cl-temp-display" aria-label="Temperatura"><span id="temp-value">--</span><span class="cl-unit">°C</span></div>
              <p class="cl-panel-caption" id="temp-note">Esperando medición</p>
            </div>
            <div class="cl-temp-illustration" aria-hidden="true"><div class="cl-tube"><span class="cl-tube-fill" id="cl-temp-fill"></span></div></div>
          </div>
          <div class="cl-panel-footer">
            <div class="cl-interval"><span>Perfil térmico</span><span id="cl-temp-label">—</span></div>
            <div class="cl-segmented" id="cl-temp-scale"><span></span><span></span><span></span><span></span><i class="cl-segment-marker" id="cl-temp-marker"></i></div>
            <div class="cl-scale"><span>Fresco</span><span>Templado</span><span>Cálido</span></div>
          </div>
        </article>

        <article class="cl-panel cl-hum">
          <div class="cl-panel-top">
            <div class="cl-panel-label"><span class="cl-panel-icon" aria-hidden="true">💧</span><span>Humedad relativa</span></div>
            <span class="cl-panel-tag">AMBIENTE</span>
          </div>
          <div class="cl-metric-layout">
            <div>
              <div class="cl-number" id="cl-hum-display" aria-label="Humedad relativa"><span id="hum-value">--</span><span class="cl-unit">%</span></div>
              <p class="cl-panel-caption" id="cl-hum-caption">Esperando medición</p>
            </div>
            <div class="cl-ring" aria-hidden="true">
              <svg viewBox="0 0 140 140" role="img"><circle class="cl-ring-bg" cx="70" cy="70" r="56"></circle><circle id="cl-ring-progress" class="cl-ring-progress" cx="70" cy="70" r="56"></circle></svg>
              <span class="cl-ring-core">💦</span>
            </div>
          </div>
          <div class="cl-panel-footer">
            <div class="cl-interval"><span>Nivel de humedad</span><span id="cl-hum-label">—</span></div>
            <div class="cl-humidity-bar"><span id="hum-progress"></span></div>
            <div class="cl-scale"><span>0%</span><span>50%</span><span>100%</span></div>
          </div>
        </article>
      </section>

      <section class="cl-information" aria-label="Detalles del monitoreo">
        <div class="cl-info">
          <div class="cl-info-icon" aria-hidden="true">✨</div>
          <div><div class="cl-info-title">Estado ambiental</div><div class="cl-info-value" id="cl-condition">Esperando lecturas</div><div class="cl-info-sub" id="cl-condition-note">Sensor DHT11</div></div>
        </div>
        <div class="cl-info">
          <div class="cl-info-icon" aria-hidden="true">📡</div>
          <div><div class="cl-info-title">Estado del control</div><div class="cl-info-value" id="cl-mode">Sin información</div><div class="cl-info-sub" id="cl-mode-note">GPIO 17</div></div>
        </div>
        <div class="cl-info">
          <div class="cl-info-icon" aria-hidden="true">↻</div>
          <div><div class="cl-info-title">Última lectura recibida</div><div class="cl-info-value" id="cl-updated">--:--:--</div><div class="cl-info-sub" id="cl-reading-status">Esperando ESP32</div></div>
        </div>
      </section>
      <p class="cl-footer-note">Temperatura y humedad obtenidas directamente del DHT11. Los valores se actualizan automáticamente mientras el ESP32 está conectado.</p>
    </main>
  </template>
  <script src="notify.js"></script><script src="app.js"></script>
  <script src="clima.js"></script>
</body>
</html>
