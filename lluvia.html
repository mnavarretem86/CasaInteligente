<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensor de lluvia · Smart Home UDEM</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="toastify-theme.css">
  <style>
    /* Efectos exclusivos de esta pantalla: lluvia completa o sol completo */
    .sun-layer{
      position:fixed;
      inset:0;
      z-index:98;
      pointer-events:none;
      overflow:hidden;
      opacity:0;
      transition:opacity .7s ease;
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 214, 83, .42), rgba(255, 214, 83, .18) 14%, rgba(255,255,255,0) 30%),
        radial-gradient(circle at 78% 18%, rgba(255, 245, 194, .16), rgba(255,255,255,0) 42%);
    }
    .sun-layer.active{opacity:1;}
    .sun-core{
      position:absolute;
      top:42px;
      right:52px;
      width:170px;
      height:170px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #fff9cf, #ffd65a 50%, #ffb935 78%, rgba(255,185,53,.7));
      box-shadow:0 0 28px rgba(255,214,90,.65), 0 0 70px rgba(255,214,90,.45), 0 0 140px rgba(255,214,90,.28);
      animation:sunFloat 4.5s ease-in-out infinite;
    }
    .sun-core::before{
      content:'☀️';
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      font-size:88px;
      filter:drop-shadow(0 6px 12px rgba(255,191,61,.4));
    }
    .sun-ray{
      position:absolute;
      top:127px;
      right:137px;
      width:12px;
      height:230px;
      border-radius:999px;
      background:linear-gradient(to bottom, rgba(255,223,107,.48), rgba(255,223,107,.02));
      transform-origin:center -18px;
      animation:sunSpin 18s linear infinite;
    }
    .sun-caption{
      position:absolute;
      left:50%;
      top:74px;
      transform:translateX(-50%);
      padding:13px 22px;
      border-radius:999px;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(255,214,83,.38);
      color:#8d6500;
      font-weight:900;
      letter-spacing:.4px;
      box-shadow:0 16px 28px rgba(255,214,83,.12);
      font-size:14px;
      backdrop-filter:blur(4px);
    }
    .scene-banner{
      position:relative;
      overflow:hidden;
      border-radius:24px;
      padding:24px 24px 22px;
      background:linear-gradient(120deg, #ffffff, #f7fbff 50%, #eef7ff);
      border:1px solid rgba(207,224,236,.9);
      box-shadow:var(--shadow);
      margin-bottom:18px;
      isolation:isolate;
    }
    .scene-banner.raining{
      background:linear-gradient(120deg, #edf6ff, #e2eef8 46%, #dae9f5);
    }
    .scene-banner::after{
      content:'';
      position:absolute;
      right:-40px;
      top:-40px;
      width:180px;
      height:180px;
      border-radius:50%;
      background:rgba(93,162,223,.08);
      z-index:0;
    }
    .scene-banner > *{position:relative;z-index:1;}
    .scene-status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:#eff7ff;
      color:#3371ac;
      font-size:11px;
      font-weight:900;
      margin-bottom:12px;
      letter-spacing:.6px;
    }
    .scene-title{font-size:clamp(24px, 3.2vw, 38px);margin:0 0 8px;color:#183d67;}
    .scene-desc{margin:0;color:#587792;font-size:14px;max-width:760px;}
    @keyframes sunSpin{from{transform:rotate(var(--angle)) translateY(-8px);}to{transform:rotate(calc(var(--angle) + 360deg)) translateY(-8px);}}
    @keyframes sunFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @media (max-width: 820px){
      .sun-core{width:122px;height:122px;top:64px;right:18px}
      .sun-core::before{font-size:64px}
      .sun-ray{top:125px;right:73px;height:180px}
      .sun-caption{top:62px;max-width:calc(100vw - 32px);text-align:center;font-size:12px;padding:10px 15px}
    }
  </style>
</head>
<body>
  <div class="app-shell" id="site-shell"></div>

  <template id="page-template">
    <div id="rain-layer" class="rain-layer" aria-hidden="true"></div>
    <div id="sun-layer" class="sun-layer" aria-hidden="true">
      <div class="sun-core"></div>
      <div class="sun-caption" id="sun-caption">☀️ Ya no está lloviendo</div>
    </div>

    <div class="page-heading">
      <p class="eyebrow">Lectura analógica · GPIO 34</p>
      <h1>Monitoreo de lluvia 🌧️</h1>
      <p class="lead">Cuando el ESP32 detecte lluvia, verás gotas animadas por toda la pantalla. Cuando deje de llover, aparecerá un sol sobre toda la interfaz.</p>
    </div>

    <section class="scene-banner" id="scene-banner">
      <span class="scene-status" id="scene-status">⏳ Esperando lectura del sensor</span>
      <h2 class="scene-title" id="scene-title">Animación ambiental del clima</h2>
      <p class="scene-desc" id="scene-desc">La animación se activa automáticamente usando el estado real del sensor de lluvia del ESP32.</p>
    </section>

    <div class="grid cols-2">
      <article class="card">
        <div class="card-heading">
          <h3>🌧️ Placa detectora de lluvia</h3>
          <button id="btn-rain" data-cmd="toggle_rain" class="btn btn-soft">INACTIVO</button>
        </div>
        <p class="stat-label">Lectura ADC (0–4095)</p>
        <p class="stat-value" id="rain-value">--</p>
        <div class="progress" style="margin:18px 0 12px"><div id="rain-progress"></div></div>
        <span id="rain-status" class="pill">--</span>
        <p class="tiny-note" id="rain-method">Verificando lectura del sensor…</p>
      </article>

      <article class="card">
        <div class="card-heading"><h3>🪟 Ventana automática</h3></div>
        <p>Con <b>Sensor de lluvia</b> y <b>Ventana automática</b> activos, el ESP32 <b>abre la ventana (GPIO13) después de 3 segundos sin lluvia</b> y <b>la cierra cuando detecta agua</b>. Al desactivar la automatización conserva la última posición.</p>
        <div class="info-row"><div class="info-title">Estado de automatización</div><button id="btn-auto-rain" data-cmd="toggle_autorain" class="btn btn-soft">--</button></div>
        <div class="info-row"><div class="info-title">Ventana</div><span id="rain-window" class="pill">--</span></div>
        <div class="actions" style="margin-top:18px"><a href="pronostico.html" class="btn btn-primary">🌦️ Ver pronóstico animado →</a></div>
      </article>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>💡 ¿Cómo usarlo?</h3>
      <p>El sensor analógico puede aumentar o disminuir su lectura al mojarse, según su módulo y conexiones. En <a href="pronostico.html" style="color:var(--blue);font-weight:800">Pronóstico local</a> puedes calibrarlo en seco y mojado sin modificar el funcionamiento de esta sección.</p>
    </div>
  </template>

  <script src="notify.js"></script><script src="app.js"></script>
  <script src="lluvia.js"></script>
</body>
</html>
