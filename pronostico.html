<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronóstico · Smart Home UDEM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Solo esta pagina: no cambia styles.css ni los otros modulos. */
    .wx-header {display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 23px}
    .wx-header h1 {font-size:clamp(33px,4vw,53px);margin:0 0 9px;letter-spacing:-2px}
    .wx-header p:last-child{color:#6a879d;font-size:14px;margin:0;max-width:680px}
    .wx-live-tag{display:flex;align-items:center;gap:9px;padding:12px 15px;border:1px solid #d4e6ef;background:#ffffffdb;border-radius:999px;color:#446b86;font-size:11px;font-weight:900;box-shadow:0 9px 23px #4085b015}
    .wx-live-dot{height:9px;width:9px;background:#18b58f;border-radius:50%;box-shadow:0 0 0 5px #18b58f20;animation:wx-pulse 2.8s infinite}
    .wx-stage{position:relative;overflow:hidden;isolation:isolate;min-height:355px;padding:clamp(23px,3vw,38px);border-radius:29px;color:#163f68;background:linear-gradient(117deg,#e5f8ff 0%,#bce8f8 56%,#97d8ee 100%);box-shadow:0 25px 55px #368eb02a;border:1px solid #c6e7f4;transition:background .65s,box-shadow .65s}
    .wx-stage.is-sun{background:linear-gradient(117deg,#e9f9ff 0%,#bfecf6 48%,#ffeab8 100%)}
    .wx-stage.is-rain{background:linear-gradient(117deg,#d6ecf7 0%,#a6c8e1 48%,#7fafd1 100%);box-shadow:0 25px 55px #5b91ae30}
    .wx-stage.is-off,.wx-stage.is-unknown{background:linear-gradient(115deg,#eff7fb,#e2edf6)}
    .wx-stage:before{content:"";position:absolute;inset:-100px -70px auto auto;width:460px;height:460px;border-radius:50%;background:#ffffff38;filter:blur(20px);z-index:-1}
    .wx-stage-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:relative;z-index:2}
    .wx-source-badge{display:inline-flex;gap:8px;align-items:center;padding:10px 14px;border-radius:999px;background:#ffffffae;border:1px solid #ffffffb5;color:#345d7c;font-size:11px;font-weight:900;letter-spacing:.3px}
    .wx-stage-top .btn{border:1px solid #ffffffcc;box-shadow:0 8px 19px #397da01d;position:relative;z-index:4}
    .wx-stage-main{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:245px;position:relative;z-index:1}
    .wx-stage-copy{position:relative;z-index:2;max-width:62%;padding:25px 0 5px}
    .wx-state{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#2d7eab;display:block;margin-bottom:14px}
    .wx-stage h2{font-size:clamp(34px,4.5vw,57px);line-height:1.06;letter-spacing:-2.3px;color:#174269;margin:0 0 12px}
    .wx-stage p{font-size:14px;max-width:480px;line-height:1.7;color:#4c738d;margin:0}
    .wx-weather-art{width:280px;height:230px;position:relative;flex:0 0 280px;filter:drop-shadow(0 18px 25px #388cb029)}
    .wx-art-sun{position:absolute;width:155px;height:155px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff9da,#ffe78f 42%,#ffbc3e 82%);box-shadow:0 0 0 18px #fff3bd45,0 0 0 40px #fff6c02b,0 0 85px #ffda85c4;right:55px;top:20px;animation:wx-sun-float 5s ease-in-out infinite;transition:opacity .5s,transform .5s}
    .wx-art-sun:after{content:'☀';position:absolute;inset:0;display:grid;place-items:center;font-size:108px;color:#ffc04370;animation:wx-sun-spin 45s linear infinite}
    .wx-cloud{position:absolute;display:block;width:180px;height:65px;right:35px;top:111px;background:#f7fcff;border-radius:48px;box-shadow:0 10px 13px #477eaa25;animation:wx-cloud-float 6s ease-in-out infinite;transition:transform .6s,background .6s}
    .wx-cloud:before{content:'';position:absolute;left:22px;bottom:29px;width:85px;height:85px;background:inherit;border-radius:50%}
    .wx-cloud:after{content:'';position:absolute;right:24px;bottom:23px;width:105px;height:105px;background:inherit;border-radius:50%}
    .wx-cloud-small{transform:scale(.55);top:48px;right:0;opacity:.67;animation-delay:-3s}
    .wx-art-drops{position:absolute;right:75px;top:179px;display:flex;gap:18px;opacity:0;transition:opacity .4s}
    .wx-art-drops span{width:7px;height:24px;border-radius:30px;background:#228fe1;transform:rotate(17deg);animation:wx-drop 1.05s ease-in infinite}
    .wx-art-drops span:nth-child(2){animation-delay:.2s}.wx-art-drops span:nth-child(3){animation-delay:.43s}.wx-art-drops span:nth-child(4){animation-delay:.6s}
    .wx-stage.is-rain .wx-art-drops{opacity:1}
    .wx-stage.is-rain .wx-art-sun{opacity:.12;transform:translateX(30px)}
    .wx-stage.is-rain .wx-cloud{background:#e4eff8}
    .wx-stage.is-off .wx-art-sun,.wx-stage.is-unknown .wx-art-sun{opacity:.25}
    .wx-stage.is-off .wx-art-drops,.wx-stage.is-unknown .wx-art-drops{opacity:0}
    .wx-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin:18px 0 32px}
    .wx-metric{background:#fffffff0;border:1px solid #daebf4;border-radius:21px;padding:23px 22px;box-shadow:0 12px 32px #3783b010;position:relative;overflow:hidden}
    .wx-metric:after{content:'';position:absolute;width:116px;height:116px;right:-43px;top:-46px;background:#e9f5ff;border-radius:50%;opacity:.8}
    .wx-metric-head{display:flex;align-items:center;gap:12px;color:#6b8ba3;font-size:12px;font-weight:800;position:relative;z-index:1}
    .wx-metric-icon{width:43px;height:43px;background:#e8f4ff;border-radius:14px;display:grid;place-items:center;font-size:24px}
    .wx-metric:nth-child(2) .wx-metric-icon{background:#e6faf5}
    .wx-metric:nth-child(3) .wx-metric-icon{background:#eaf0ff}
    .wx-metric-value{font-family:'Outfit','DM Sans',sans-serif;font-size:clamp(28px,3.2vw,45px);line-height:1.15;font-weight:800;letter-spacing:-1.2px;color:#1d4f7b;margin:17px 0 4px;position:relative;z-index:1}
    .wx-metric-note{font-size:11px;color:#7a96a9;margin:0;position:relative;z-index:1}
    .wx-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}
    .wx-section-head h2{font-size:clamp(25px,3vw,33px);color:#163b5e;margin:0 0 5px}
    .wx-section-head p{margin:0;color:#7790a6;font-size:13px}
    .wx-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}
    .wx-location{background:#fffffff0;border:1px solid #d7e8f3;border-radius:25px;padding:23px;box-shadow:0 17px 40px #377ca812;min-width:0;transition:transform .3s}
    .wx-location:hover{transform:translateY(-2px)}
    .wx-location-local{background:linear-gradient(135deg,#fcffff,#ecfaff)}
    .wx-location-web{background:linear-gradient(135deg,#fffefe,#f4f8ff)}
    .wx-location-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:21px}
    .wx-location-ident{display:flex;align-items:center;gap:12px}
    .wx-location-icon{width:49px;height:49px;background:#e3f3ff;border-radius:16px;display:grid;place-items:center;font-size:25px}
    .wx-location-name{font-size:18px;font-weight:900;margin:0;color:#1c496b}
    .wx-location-sub{font-size:11px;color:#80a0b5;margin:2px 0 0}
    .wx-data-state{background:#e5f6ed;color:#128064;font-size:10px;font-weight:900;border-radius:99px;padding:8px 10px}
    .wx-data-state.wait{background:#fff4da;color:#9b7426}.wx-data-state.error{background:#fff0ed;color:#be5954}
    .wx-location-reading{display:flex;align-items:center;gap:18px;min-width:0;margin-bottom:16px}
    .wx-location-big{font:800 clamp(37px,4vw,51px)/1 'Outfit','DM Sans',sans-serif;letter-spacing:-2px;color:#194d7a;white-space:nowrap}
    .wx-location-condition{color:#527a97;font-size:13px;font-weight:800;min-width:0}
    .wx-location-condition span{display:block;color:#91a7b7;font-size:11px;font-weight:600;margin-top:4px}
    .wx-mini-data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;border-top:1px solid #e3eef5;padding-top:15px}
    .wx-mini{padding:12px 13px;background:#ffffffb9;border:1px solid #e9f2f7;border-radius:14px;min-width:0}
    .wx-mini span{display:block;color:#819aae;font-size:10px;font-weight:800;margin-bottom:7px}
    .wx-mini strong{display:block;font-size:19px;font-weight:900;color:#2b5979}
    .wx-web-bottom{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:15px}
    .wx-web-bottom small{color:#7e9aad;font-size:10px}
    .wx-refresh{display:inline-flex;align-items:center;gap:7px;border:0;background:#e1efff;color:#236fc4;font-size:11px;font-weight:900;padding:10px 13px;border-radius:11px;cursor:pointer}
    .wx-refresh:hover{background:#d0e8ff}.wx-refresh:disabled{opacity:.55;cursor:wait}
    .wx-footnote{margin:16px 0 0;background:#ebf6fc8e;border:1px solid #d8eaf4;border-radius:17px;padding:15px 18px;color:#63829a;font-size:11px;line-height:1.75}
    .wx-footnote a{color:#2475d3;font-weight:900;text-decoration:underline;text-underline-offset:2px}
    /* Efectos completos solo cuando el sensor de lluvia esta habilitado. */
    .wx-sun-layer{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .9s;overflow:hidden;background:radial-gradient(circle at 89% 15%,#ffed9442 0%,#ffef920d 20%,transparent 48%)}
    .wx-sun-layer.active{opacity:1}
    .wx-sun-orb{position:absolute;top:46px;right:4vw;width:125px;height:125px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fffad0,#ffd85d 48%,#ffb52f);box-shadow:0 0 40px #ffd45395,0 0 140px #ffc83f63;animation:wx-sun-float 5s ease-in-out infinite}
    .wx-sun-orb:after{content:'☀';color:#ffb22faa;position:absolute;inset:0;display:grid;place-items:center;font-size:93px;animation:wx-sun-spin 55s linear infinite}
    @keyframes wx-sun-float{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
    @keyframes wx-sun-spin{to{transform:rotate(360deg)}}
    @keyframes wx-pulse{50%{box-shadow:0 0 0 9px #18b58f09}}
    @keyframes wx-drop{0%{transform:translateY(-15px) rotate(17deg);opacity:0}25%{opacity:1}100%{transform:translateY(30px) rotate(17deg);opacity:0}}
    @keyframes wx-cloud-float{0%,100%{translate:0 0}50%{translate:-10px 6px}}
    @media(max-width:1110px){.wx-weather-art{flex-basis:210px;width:210px;scale:.85;transform-origin:right center}.wx-stage-copy{max-width:67%}}
    @media(max-width:850px){.wx-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.wx-weather-art{opacity:.47;position:absolute;right:4px;bottom:16px}.wx-stage-copy{max-width:85%}.wx-stage-main{min-height:210px}}
    @media(max-width:660px){.wx-header h1{letter-spacing:-1px}.wx-stage{min-height:335px;padding:22px}.wx-stage-copy{max-width:100%;padding-top:27px}.wx-stage h2{font-size:38px}.wx-weather-art{opacity:.24;scale:.75;right:-29px;bottom:3px}.wx-metrics{grid-template-columns:1fr;gap:11px}.wx-metric{padding:18px 20px}.wx-metric-value{margin-top:11px;font-size:35px}.wx-compare{grid-template-columns:1fr}.wx-location{padding:20px}.wx-sun-orb{width:78px;height:78px;top:20px;right:4vw}.wx-sun-orb:after{font-size:61px}.wx-stage-main{min-height:215px}}
    @media(prefers-reduced-motion:reduce){.wx-weather-art *,.wx-live-dot,.wx-sun-orb,.wx-sun-orb:after{animation:none!important}}
  </style>
</head>
<body>
  <div class="app-shell" id="site-shell"></div>
  <template id="page-template">
    <div id="rain-layer" class="rain-layer" aria-hidden="true"></div>
    <div id="wx-sun-layer" class="wx-sun-layer" aria-hidden="true"><div class="wx-sun-orb"></div></div>

    <div class="wx-header">
      <div>
        <p class="eyebrow">Estación IoT · Tiempo actual</p>
        <h1>Clima en vivo <span aria-hidden="true">🌤️</span></h1>
        <p>Descubre lo que ocurre en tu estación ESP32 y compáralo con el tiempo actual de Managua.</p>
      </div>
      <div class="wx-live-tag"><span class="wx-live-dot"></span><span>ESTACIÓN LOCAL · EN DIRECTO</span></div>
    </div>

    <section class="wx-stage is-unknown" id="weather-stage" aria-live="polite">
      <div class="wx-stage-top">
        <span class="wx-source-badge">📍 Mi estación ESP32 · GPIO 34 + DHT11</span>
        <button id="btn-weather-rain" class="btn btn-soft" data-cmd="toggle_rain">Activar detector</button>
      </div>
      <div class="wx-stage-main">
        <div class="wx-stage-copy">
          <span id="weather-status" class="wx-state">CONECTANDO CON EL ESP32</span>
          <h2 id="weather-title">Observando el cielo...</h2>
          <p id="weather-description">Estamos consultando los sensores para conocer las condiciones de tu estación.</p>
        </div>
        <div class="wx-weather-art" aria-hidden="true">
          <span class="wx-art-sun"></span>
          <span class="wx-cloud wx-cloud-small"></span>
          <span class="wx-cloud"></span>
          <div class="wx-art-drops"><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>

    <section class="wx-metrics" aria-label="Lecturas de la estación local">
      <article class="wx-metric"><div class="wx-metric-head"><span class="wx-metric-icon">🌡️</span>Temperatura ambiente</div><div class="wx-metric-value" id="weather-temperature">— °C</div><p class="wx-metric-note">Medición del DHT11</p></article>
      <article class="wx-metric"><div class="wx-metric-head"><span class="wx-metric-icon">💧</span>Humedad relativa</div><div class="wx-metric-value" id="weather-humidity">— %</div><p class="wx-metric-note">Medición del DHT11</p></article>
      <article class="wx-metric"><div class="wx-metric-head"><span class="wx-metric-icon">🌦️</span>Lluvia en la estación</div><div class="wx-metric-value" id="weather-rain-summary">Esperando</div><p class="wx-metric-note" id="weather-rain-note">Estado del detector físico</p></article>
    </section>

    <div class="wx-section-head">
      <div><p class="eyebrow">Comparativa de condiciones actuales</p><h2>Mi estación <span style="color:#8eb0c4">vs.</span> Managua</h2><p>Dos fuentes distintas: tus sensores y un servicio meteorológico por internet.</p></div>
    </div>

    <section class="wx-compare" aria-label="Comparación local e internet">
      <article class="wx-location wx-location-local">
        <div class="wx-location-top">
          <div class="wx-location-ident"><span class="wx-location-icon">🏠</span><div><h3 class="wx-location-name">Mi estación</h3><p class="wx-location-sub">ESP32 · Datos físicos locales</p></div></div>
          <span class="wx-data-state wait" id="local-source-state">Conectando</span>
        </div>
        <div class="wx-location-reading"><div class="wx-location-big" id="local-compare-temp">— °C</div><div class="wx-location-condition" id="local-compare-condition">Esperando al ESP32<span>Detección de agua real</span></div></div>
        <div class="wx-mini-data">
          <div class="wx-mini"><span>💧 HUMEDAD</span><strong id="local-compare-humidity">— %</strong></div>
          <div class="wx-mini"><span>🌧️ LLUVIA</span><strong id="local-compare-rain">—</strong></div>
        </div>
      </article>

      <article class="wx-location wx-location-web">
        <div class="wx-location-top">
          <div class="wx-location-ident"><span class="wx-location-icon" id="managua-icon">🌍</span><div><h3 class="wx-location-name">Managua, Nicaragua</h3><p class="wx-location-sub">Internet · Datos de Open-Meteo</p></div></div>
          <span class="wx-data-state wait" id="managua-source-state">Consultando</span>
        </div>
        <div class="wx-location-reading"><div class="wx-location-big" id="managua-temp">— °C</div><div class="wx-location-condition" id="managua-condition">Consultando clima<span id="managua-time">Conectando al servicio</span></div></div>
        <div class="wx-mini-data">
          <div class="wx-mini"><span>💧 HUMEDAD</span><strong id="managua-humidity">— %</strong></div>
          <div class="wx-mini"><span>🌧️ PRECIPITACIÓN ACTUAL</span><strong id="managua-rain">— mm</strong></div>
          <div class="wx-mini"><span>💨 VIENTO</span><strong id="managua-wind">— km/h</strong></div>
          <div class="wx-mini"><span>☔ PROB. MÁX. HOY</span><strong id="managua-probability">— %</strong></div>
        </div>
        <div class="wx-web-bottom"><small id="managua-updated" role="status">Actualización automática cada 10 minutos</small><button type="button" id="btn-web-refresh" class="wx-refresh">↻ Actualizar internet</button></div>
      </article>
    </section>
    <p class="wx-footnote">🌐 <strong>Sobre la comparación:</strong> Managua se usa como referencia y puede estar lejos de tu ESP32. La estación detecta contacto con agua; Open-Meteo ofrece condiciones modeladas para Managua, no una medición de la misma placa. La precipitación actual corresponde al intervalo que proporciona el servicio, mientras que la probabilidad máxima es para el día. Fuente: <a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener noreferrer">Open-Meteo</a>.</p>
  </template>
  <script src="app.js"></script>
  <script src="pronostico.js"></script>
</body>
</html>
